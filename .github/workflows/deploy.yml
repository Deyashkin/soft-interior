name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx eslint src

      # Один сервер на оба домена: город определяется по адресу во время
      # работы, а не при сборке. Адрес приёма заявок вшивается в клиентский код.
      - name: Build Next.js (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}

      # Сообщаем Coolify, что образ обновился: он скачает latest и перезапустит
      # контейнер. Пока секрет COOLIFY_WEBHOOK не задан — шаг пропускается.
      - name: Deploy via Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [ -z "${COOLIFY_WEBHOOK}" ]; then
            echo "COOLIFY_WEBHOOK не задан — деплой пропущен"
            exit 0
          fi
          code=$(curl --silent --show-error --max-time 30 -X POST \
            -o /tmp/coolify.out -w '%{http_code}' \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}") || code=curl-error
          echo "Coolify ответил: HTTP ${code}"
          head -c 500 /tmp/coolify.out 2>/dev/null || true
          echo
          case "${code}" in 2??) ;; *) exit 1 ;; esac
