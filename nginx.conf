server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # За прокси nginx не знает про https: редирект /x → /x/ должен быть
    # относительным, иначе он уведёт посетителя с https на http.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # TLS и редирект http→https делает прокси Coolify.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Сайт собран с trailingSlash: /remont/ → /remont/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # Файлы с хешем в имени — кэшируем навсегда.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
